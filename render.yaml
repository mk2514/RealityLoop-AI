services:
  - type: web
    name: realityloop-api
    runtime: python
    rootDir: backend
    plan: free            # free web services sleep after ~15 min idle; use starter to avoid cold starts
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGO_ONLY_INFRA
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: RealityLoop
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: PUBLIC_APP_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MQTT_ENABLED
        value: "false"
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
